name: Run Batch Test Bed

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'SQL files to load on start up (space or comma separated)'
        required: false
        default: 'user.sql'
      top:
        description: 'Number of statements in the pg_stat_statements report'
        required: false
        default: '10'

jobs:
  run-batch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Run the test bed and dump the output
      env:
        SQL_FILES: ${{ inputs.files }}
      run: npm start -- --top "${{ inputs.top }}" --out output.log

    - name: Upload output artifact
      uses: actions/upload-artifact@v4
      with:
        name: script-output-log
        path: output.log
        if-no-files-found: error
        retention-days: 7
